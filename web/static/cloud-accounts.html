<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网盘账号管理</title>
<style>body{font:15px system-ui;background:#f5f6fa;color:#163047;margin:0}main{max-width:900px;margin:40px auto;padding:20px}a{color:#087b78}header{display:flex;justify-content:space-between;align-items:center}article,.notice{background:white;border:1px solid #dce2e8;border-radius:16px;padding:24px;margin:18px 0}.muted{color:#69798a;font-size:14px}button{border:1px solid #cdd9de;background:white;color:#0b7874;padding:10px 16px;border-radius:9px;cursor:pointer;margin:5px}button.primary{background:#087b78;color:white}button:disabled{opacity:.5;cursor:default}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f3;padding:14px 0;gap:12px}.badge{background:#e3f5ef;color:#11745b;border-radius:20px;padding:4px 10px;font-size:12px}#message{white-space:pre-wrap;color:#9c4f00}h2{font-size:19px}input{padding:12px;border:1px solid #ccd6df;border-radius:8px;margin:6px;width:220px}@media(max-width:550px){main{margin:8px auto}.row{align-items:flex-start;flex-direction:column}}</style>
<main><header><h1>网盘账号</h1><a href="/">返回下载器</a></header><p class="muted">会员到期或更换账号时，先添加新账号，再选择启用。旧账号保留，方便切换回来。</p>
<div id="login" class="notice" hidden><h2>管理员登录</h2><input id="user" placeholder="管理员用户名" autocomplete="username"><input id="pass" type="password" placeholder="密码" autocomplete="current-password"><button id="signin" class="primary">登录</button></div>
<div id="message" role="status" aria-live="polite"></div><section id="cards"></section><button id="refresh">刷新账号状态</button>
<div class="notice muted">扫码窗口在运行下载器的电脑上打开，请从本机地址进入本页。授权使用 Windows 加密保存，不向访客显示。连接状态不代表会员有效期或实际下载速度；会员状态请在网盘官方页面查看。</div></main>
<script>
const names={baidu:'百度网盘',ali:'阿里云盘',quark:'夸克网盘'};
const msg=document.querySelector('#message');
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok){if(r.status===403)document.querySelector('#login').hidden=false;throw Error(d.detail||'请求失败')}return d}
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
async function action(button,run){button.disabled=true;msg.textContent='';try{await run()}catch(e){msg.textContent=e.message}finally{button.disabled=false}}
async function load(){const d=await api('/api/admin/cloud-accounts');document.querySelector('#login').hidden=true;const cards=document.querySelector('#cards');cards.replaceChildren();for(const [key,name] of Object.entries(names)){const card=document.createElement('article');card.append(text('h2',name),text('p',key==='baidu'?'支持后台账号切换；下载中的任务结束后再切换。':'下载驱动尚未接通；当前仅保存和选择授权。','muted'));const add=text('button','扫码添加 / 重新授权','primary');add.onclick=()=>action(add,async()=>{const r=await api('/api/admin/cloud-accounts/connect',{provider:key});msg.textContent=r.message});card.append(add);const list=d.accounts.filter(a=>a.provider===key);if(!list.length)card.append(text('p','尚未保存账号','muted'));for(const a of list){const row=text('div','','row'),info=document.createElement('div');info.append(text('strong',a.label),text('p',a.created+' · '+(a.verified?'登录授权曾验证，未代表下载验收':'授权已保存，下载未验证'),'muted'));row.append(info);if(d.active[key]===a.id)row.append(text('span',key==='baidu'?'当前使用':'已选择 · 待接通','badge'));else{const use=text('button',key==='baidu'?'切换到此账号':'选择此授权');use.onclick=()=>action(use,async()=>{await api('/api/admin/cloud-accounts/activate',{id:a.id});await load()});row.append(use)}card.append(row)}cards.append(card)}}
document.querySelector('#refresh').onclick=e=>action(e.target,load);
document.querySelector('#signin').onclick=e=>action(e.target,async()=>{await api('/api/admin/login',{username:document.querySelector('#user').value,password:document.querySelector('#pass').value});document.querySelector('#pass').value='';await load()});load().catch(e=>msg.textContent=e.message);
</script></html>
