<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>视频下载器</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1b1d21; --muted:#6b7280;
    --line:#e5e7eb; --accent:#0f766e; --accent-soft:#ccfbf1;
    --ok:#15803d; --warn:#b45309; --err:#b91c1c; --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa2af;
      --line:#2c313a; --accent:#2dd4bf; --accent-soft:#134e4a;
      --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  textarea{
    width:100%;min-width:0;padding:13px 14px;font-size:16px;line-height:1.5;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);
    font-family:inherit;resize:vertical;min-height:84px;max-height:320px;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  button{
    padding:13px 20px;font-size:16px;font-weight:600;border:0;border-radius:10px;
    background:var(--accent);color:#fff;cursor:pointer;
  }
  button:disabled{opacity:.45;cursor:default}
  button.ghost{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    font-weight:500;padding:8px 14px;font-size:14px;
  }
  button.ghost:disabled{opacity:.4}
  button.danger{color:var(--err);border-color:currentColor}
  button.small{padding:8px 16px;font-size:14px}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}
  .jobs{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .job-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .job-title{font-weight:600;word-break:break-all;font-size:15px}
  .job-url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:2px}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
  .tag.ok{background:transparent;color:var(--ok);border:1px solid currentColor}
  .tag.err{background:transparent;color:var(--err);border:1px solid currentColor}
  .tag.warn{background:transparent;color:var(--warn);border:1px solid currentColor}
  .bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 6px}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .msg{font-size:13px;color:var(--muted);word-break:break-all}

  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:14px;padding:10px 12px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;
  }
  .toolbar label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
  .toolbar .spacer{flex:1}
  .count{font-size:13px;color:var(--muted)}

  /* 四个按钮作为一组整体换行，不会散成两行半 */
  .btn-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn-group button{white-space:nowrap}
  /* 取消 = 停止动作，不销毁文件，所以用琥珀色而不是红色 */
  button.ghost.warn{color:var(--warn);border-color:currentColor}
  button.ghost.warn:disabled{opacity:.4}
  @media (max-width:520px){
    .btn-group{width:100%}
    .btn-group button{flex:1 1 auto;min-width:88px;padding:9px 10px;font-size:13px}
    .toolbar .spacer{display:none}
  }

  .files{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .file{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;background:var(--bg);border-radius:9px;font-size:14px;
    border:1px solid transparent;
  }
  .file.sel{border-color:var(--accent);background:var(--accent-soft)}
  .file label{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
  .fname{word-break:break-all;min-width:0}
  .fsize{color:var(--muted);font-size:12px}
  .file a{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}

  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--muted);padding:34px 0;font-size:14px}
  .note{font-size:12px;color:var(--muted);margin-top:8px}

  /* 页面内确认条。用它替代浏览器原生 confirm()——
     原生弹窗会顶着"192.168.0.14:8000 显示"出现在屏幕正中，和页面割裂。 */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:flex;justify-content:center;align-items:flex-start;
    padding:0 16px;z-index:100;opacity:0;pointer-events:none;transition:opacity .16s;
  }
  .mask.on{opacity:1;pointer-events:auto}
  .dialog{
    width:100%;max-width:420px;margin-top:11vh;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.22);
    transform:translateY(-14px);transition:transform .16s;
  }
  .mask.on .dialog{transform:none}
  .dialog h3{margin:0 0 6px;font-size:17px;font-weight:600}
  .dialog p{margin:0;font-size:14px;color:var(--muted);line-height:1.65}
  .dialog .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .dialog button{padding:10px 18px;font-size:15px}

  .topbar{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
  .who #whoName{font-weight:600;color:var(--text)}
  .gate{max-width:380px;margin-top:8vh}
  .gate input{
    width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;
  }
  .gate input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .user-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:9px;font-size:14px}
  .user-row .spacer{flex:1}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .owner{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}

  [hidden]{display:none!important}
  .thumb{width:54px;height:72px;object-fit:cover;border-radius:7px;background:var(--line)}
  .preview-link{padding:0;border:0;background:transparent;flex:none}
  .file .fname{flex:1;background:transparent;color:var(--text);text-align:left;padding:0;font-size:13px;font-weight:400}
  .file label{flex:0 0 18px;min-width:18px}.file input[type=checkbox]{margin:0}
  .file-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .file-actions button{padding:7px;font-size:12px}
  #previewDialog{width:min(620px,94vw);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}
  #previewDialog::backdrop{background:#0009}
  #previewVideo{width:100%;max-height:62vh;background:#000}
  @media(max-width:520px){.file{gap:8px;padding:8px}.thumb{width:44px;height:60px}.file-actions{max-width:66px}}
</style>
</head>
<body>
<!-- 未登录时显示：首次初始化 / 登录 -->
<div class="wrap gate" id="gate" hidden>
  <h1 id="gateTitle">登录</h1>
  <p class="sub" id="gateSub">请输入账号密码</p>
  <div class="card">
    <input id="gUser" type="text" placeholder="用户名" autocomplete="username" spellcheck="false">
    <input id="gPass" type="password" placeholder="密码" autocomplete="current-password" style="margin-top:10px">
    <div class="row" style="margin-top:14px;align-items:center">
      <button id="gGo">登录</button>
      <button class="ghost" onclick="boot()">返回下载器</button><span class="hint" id="gMsg" style="margin:0"></span>
    </div>
  </div>
</div>

<div class="wrap" id="main" hidden>
  <div class="topbar">
    <div>
      <h1>视频下载器</h1>
      <p class="sub">粘贴链接，自动识别来源。TikTok 取无水印源，YouTube 取最高画质。</p>
    </div>
    <div class="who">
      <span id="whoName"></span>
      <a class="ghost" id="cloudAccountsBtn" href="/cloud-accounts.html" hidden>网盘账号</a><button class="ghost" id="adminBtn" hidden onclick="toggleAdmin()">账号管理</button>
      <button class="ghost" id="scopeBtn" hidden onclick="switchScope()">全部记录</button>
      <button class="ghost" id="loginBtn" onclick="showGate()">管理员后台</button> <a class="ghost" href="/website-client-checker.html" target="_blank" rel="noopener">连接检查器</a>
      <button class="ghost" id="logoutBtn" hidden onclick="logout()">退出管理</button>
    </div>
  </div>

  <div class="card" id="adminPanel" hidden style="margin-bottom:14px">
    <h3 style="margin:0 0 12px;font-size:16px">账号管理</h3>
    <div id="userList" class="files" style="margin:0 0 14px"></div>
    <div class="note" id="adminMsg">普通使用免登录，按浏览器隔离；管理员可以查看全部记录。</div>
  </div>

  <div class="card">
    <label class="note">下载类型：<select id="sourceMode"><option value="auto">自动识别</option><option value="file">原文件直链（安装包、视频等）</option></select></label>
    <p class="note">原文件下载不转码。百度分享下载需主机先连接账号；后台串行处理百度任务，视频与安装包均保留原文件。阿里与夸克尚未接入。</p>
    <textarea id="url" rows="3" spellcheck="false" autocapitalize="off"
      placeholder="粘贴视频链接、原文件直链或 Symphony 分享码&#10;可以一次贴多个，一行一个"></textarea>
    <div class="row" style="margin-top:10px;align-items:center">
      <button id="go">下载</button>
      <span class="count" id="linkCount"></span>
      <span class="spacer" style="flex:1"></span>
      <span class="note" style="margin:0">Ctrl + Enter 也可提交</span>
    </div>
    <label class="note">视频传输：<select id="transferMode"><option value="auto">自动（公网优先平台直连）</option><option value="server">主机传输</option></select> · 当前优先支持 Symphony；直连失败自动回退。</label>
    <div class="hint" id="hint">支持 TikTok、YouTube、B站等 1000+ 站点，以及 Symphony 分享链接。</div>
    <div class="note">「移出列表」只清理显示，文件不动；只有「删除文件」才会真的删。</div>
  </div>

  <div id="activeBar" class="toolbar" hidden style="margin-top:14px">
    <span class="count" id="activeCount"></span>
    <span class="spacer"></span>
    <button class="ghost danger" onclick="cancelAll()">全部取消</button>
  </div>

  <div class="jobs" id="jobs"><div class="empty">还没有任务</div></div>
</div>

<div class="mask" id="mask">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dlgTitle"></h3>
    <p id="dlgBody"></p>
    <div class="btns">
      <button class="ghost" id="dlgNo">取消</button>
      <button id="dlgYes"></button>
    </div>
  </div>
</div>

<dialog id="previewDialog">
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><strong>视频预览</strong><button class="ghost" onclick="closePreview()">关闭</button></div>
  <video id="previewVideo" controls playsinline preload="metadata"></video>
  <p class="hint" id="saveHelp"></p>
  <div class="row"><a id="saveOriginal" download>下载原视频</a><button id="shareVideo" class="small" hidden>分享 / 保存到相册</button></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const jobsEl = $('#jobs'), urlEl = $('#url'), goEl = $('#go'), hintEl = $('#hint');

// 勾选状态存在这里，不能只存在 DOM 上——页面每 1.2 秒自动刷新一次，
// 重绘会把 DOM 里的勾选全部冲掉，用户正勾到一半就白勾了。
const selected = new Set();
const key = (jobId, name) => jobId + '\u0000' + name;

// ---- 页面内确认框，替代原生 confirm() ----
const maskEl = $('#mask'), dlgTitle = $('#dlgTitle'), dlgBody = $('#dlgBody'),
      dlgYes = $('#dlgYes'), dlgNo = $('#dlgNo');
let dlgResolve = null;

function ask({title, body = '', ok = '确定', danger = false}){
  if(dlgResolve) return Promise.resolve(false);
  dlgTitle.textContent = title;
  dlgBody.textContent = body;
  dlgBody.style.display = body ? '' : 'none';
  dlgYes.textContent = ok;
  dlgYes.className = danger ? 'danger-solid' : '';
  dlgYes.style.background = danger ? 'var(--err)' : 'var(--accent)';
  maskEl.classList.add('on');
  dlgYes.focus();
  return new Promise(res => { dlgResolve = res; });
}

function closeDlg(v){
  maskEl.classList.remove('on');
  if(dlgResolve){ dlgResolve(v); dlgResolve = null; }
}

dlgYes.onclick = () => closeDlg(true);
dlgNo.onclick  = () => closeDlg(false);
maskEl.addEventListener('click', e => { if(e.target === maskEl) closeDlg(false); });
document.addEventListener('keydown', e => {
  if(!maskEl.classList.contains('on')) return;
  if(e.key === 'Escape') closeDlg(false);
  if(e.key === 'Enter')  closeDlg(true);
});

let lastSnapshot = '';
const downloadTransfers = new Map();
let busy = false;   // 仅列表修改期间短暂锁定；下载按任务独立管理
function jobBusy(id){return busy || !!downloadTransfers.get(id)?.active;}
function transfersActive(){return [...downloadTransfers.values()].some(t=>t.active);}

const fmtSize = b => b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : (b/1024).toFixed(0)+' KB';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STATUS = {
  queued:  ['排队中', ''],
  running: ['下载中', ''],
  done:      ['完成',   'ok'],
  partial:   ['部分完成','warn'],
  error:     ['失败',   'err'],
  cancelled: ['已取消', 'warn'],
};

function selectedIn(job){
  return (job.files || []).filter(f => selected.has(key(job.id, f.name)));
}

function render(jobs){
  // 顶部的"全部取消"条：有任务在跑或排队时才出现
  const act = jobs.filter(j => j.status === 'running' || j.status === 'queued');
  const bar = $('#activeBar');
  bar.hidden = act.length === 0;
  if(act.length){
    const running = act.filter(j => j.status === 'running').length;
    $('#activeCount').textContent =
      `${running} 个下载中` + (act.length > running ? `，${act.length - running} 个排队中` : '');
  }

  if(!jobs.length){ jobsEl.innerHTML = '<div class="empty">还没有任务</div>'; return; }

  jobsEl.innerHTML = jobs.map(j => {
    const [label, cls] = STATUS[j.status] || [j.status, ''];
    const active = j.status === 'running' || j.status === 'queued';
    const pct = Math.round((j.progress || 0) * 100);
    const counter = j.total > 1 ? ` · ${j.finished}/${j.total}` : '';
    const files = j.files || [];
    const nSel = selectedIn(j).length;
    const allSel = files.length > 0 && nSel === files.length;

    // 任务在跑但还没产出文件时也要显示这一行，否则取消按钮没地方放
    const toolbar = (files.length || active) ? `
      <div class="toolbar">
        ${files.length ? `
        <label>
          <input type="checkbox" ${jobBusy(j.id) ? 'disabled' : ''} ${allSel ? 'checked' : ''}
                 onchange="toggleAll('${j.id}', this.checked)">
          全选
        </label>
        <span class="count">已选 ${nSel} / ${files.length}</span>` : ''}
        <span class="spacer"></span>
        <div class="btn-group">
          ${files.length ? `
          <button class="small" ${nSel && !jobBusy(j.id) ? '' : 'disabled'}
                  data-download-job="${j.id}" onclick="downloadSelected('${j.id}')">${downloadTransfers.get(j.id)?.active ? '接收中…' : '下载选中'}</button>` : ''}
          ${active ? `
          <button class="ghost warn" onclick="cancelJob('${j.id}')"
                  title="停止下载，已下好的保留">取消下载</button>` : ''}
          <button class="ghost" ${files.length && nSel && !jobBusy(j.id) ? '' : 'disabled'}
                  onclick="removeSelected('${j.id}', false)"
                  title="只从这个列表里拿掉，电脑上的文件不动">移出列表</button>
          <button class="ghost danger" ${files.length && nSel && !jobBusy(j.id) ? '' : 'disabled'}
                  onclick="removeSelected('${j.id}', true)"
                  title="连电脑上的文件一起删掉，不可恢复">删除文件</button>
        </div>
      </div>` : '';

    const fileRows = files.map(f => {
      const video = /\.(mp4|webm|mkv|mov|m4v|avi)$/i.test(f.name);
      const on = selected.has(key(j.id, f.name));
      const arg = esc(JSON.stringify(f.name));
      const base = `/api/files/${j.id}/${encodeURIComponent(f.name)}`;
      return `<div class="file ${on ? 'sel' : ''}">
        <label><input aria-label="选择文件" type="checkbox" ${jobBusy(j.id) ? 'disabled' : ''} ${on ? 'checked' : ''} onchange="toggleOne('${j.id}', ${arg}, this.checked)"></label>
        ${video ? `<button class="preview-link" title="预览视频" onclick="previewFile('${j.id}', ${arg})"><img class="thumb" alt="视频首帧" loading="lazy" src="/api/thumb/${j.id}/${encodeURIComponent(f.name)}" onerror="this.style.visibility='hidden'"></button>` : `<span class="thumb" style="display:grid;place-items:center" aria-label="文件">📦</span>`}
        <button class="fname" onclick="${video ? 'previewFile' : 'downloadSelected'}('${j.id}', ${arg})">${esc(f.name)}<br><span class="fsize">${fmtSize(f.size)}</span></button>
        <div class="file-actions">${MOBILE && video ? `<button class="ghost" onclick="previewFile('${j.id}', ${arg})">保存视频</button>` : `<button class="ghost" ${jobBusy(j.id) ? 'disabled' : ''} onclick="downloadSelected('${j.id}', ${arg})">保存</button>`}
        ${!MOBILE ? LOCAL ? `<button class="ghost" title="定位主机保存的文件" onclick="revealFile('${j.id}', ${arg})">📁 定位</button>` : `<button class="ghost" data-folder-file="${esc(f.name)}" title="定位当前浏览器已保存的文件（需安装定位扩展）" onclick="folderLocatorHelp()">📁 定位</button>` : ''}</div>
      </div>`;
    }).join('');

    return `<div class="job">
      <div class="job-top">
        <div style="min-width:0">
          <div class="job-title">${esc(j.title || j.url)}${
            // 管理员能看到所有人的记录，标出是谁提交的
            (ME && ME.is_admin && j.owner && j.owner !== ME.name)
              ? `<span class="owner">${esc(j.owner)}</span>` : ''
          }</div>
          <div class="job-url">${esc(j.url)}</div>
        </div>
        <span class="tag ${cls}">${label}${counter}</span>
      </div>
      ${active ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
      ${j.message ? `<div class="msg">${esc(j.message)}</div>` : ''}
      ${toolbar}
      <div data-transfer="${j.id}" role="status" class="hint" ${downloadTransfers.has(j.id) ? "" : "hidden"}></div>
      ${fileRows ? `<div class="files">${fileRows}</div>` : ''}
      ${
        // 有文件时，全选 + 上面那排按钮已经能覆盖整条任务，
        // 再放一组"整个…"就是重复。只有失败/无产出的任务才需要这个兜底。
        (!files.length && !active) ? `
      <div class="acts">
        <button class="ghost" onclick="removeJob('${j.id}', false)">移出列表</button>
        <button class="ghost danger" onclick="removeJob('${j.id}', true)">删除记录</button>
      </div>` : ''}
    </div>`;
  }).join('');
  downloadTransfers.forEach((_, id) => updateTransfer(id));
}

let cache = [];
let listEpoch=0, refreshSequence=0;

async function refresh(force){
  if(busy && !force) return;
  const epoch=listEpoch, sequence=++refreshSequence;
  try{
    const r = await fetch('/api/jobs?scope=' + SCOPE);
    if(r.status === 401){   // 会话过期，退回登录页而不是空转
      ME = null;
      await boot();
      return;
    }
    if(!r.ok) throw new Error(`刷新失败（HTTP ${r.status}）`);
    const jobs = await r.json();
    if(epoch!==listEpoch || sequence!==refreshSequence || busy) return;
    cache = jobs;

    // 清掉已经不存在的文件的勾选，避免"已选 3"但只剩 1 个文件
    const alive = new Set();
    jobs.forEach(j => (j.files||[]).forEach(f => alive.add(key(j.id, f.name))));
    [...selected].forEach(k => { if(!alive.has(k)) selected.delete(k); });

    // 数据没变就不重绘，减少闪烁，也避免打断正在点的勾选框
    const snap = JSON.stringify(jobs) + '|' + [...selected].sort().join('|');
    if(snap === lastSnapshot) return;
    lastSnapshot = snap;
    render(jobs);
  }catch(e){}
}

function repaint(){
  lastSnapshot = '';
  render(cache);
}

function toggleOne(jobId, name, on){
  if(jobBusy(jobId)) return;
  const k = key(jobId, name);
  on ? selected.add(k) : selected.delete(k);
  repaint();
}

function toggleAll(jobId, on){
  if(jobBusy(jobId)) return;
  const job = cache.find(j => j.id === jobId);
  if(!job) return;
  (job.files||[]).forEach(f => {
    const k = key(jobId, f.name);
    on ? selected.add(k) : selected.delete(k);
  });
  repaint();
}

async function fetchVideo(jobId,name,signal,onRoute=()=>{}){
  const localUrl=`/api/files/${jobId}/${encodeURIComponent(name)}`;
  // LAN transfers remain local; public HTTPS entry prefers the platform CDN.
  const useDirect=document.querySelector('#transferMode')?.value!=='server' && location.protocol==='https:';
  if(useDirect){
    onRoute('正在获取平台直连地址');
    try{
      const meta=await fetch(`/api/direct/${jobId}/${encodeURIComponent(name)}`,{signal});
      if(meta.ok){
        const source=await meta.json();
        if(source.available && new URL(source.url).protocol==='https:'){
          onRoute('平台直连（不经过主机隧道）');
          const direct=await fetch(source.url,{signal,credentials:'omit',referrerPolicy:'no-referrer'});
          if(direct.ok && (direct.headers.get('content-type')||'').toLowerCase().startsWith('video/')) return direct;
          await direct.body?.cancel();
        }
      }
    }catch(e){if(signal?.aborted || e.name==='AbortError') throw e;}
  }
  onRoute(useDirect ? '主机传输（直连不可用，已回退）' : '主机传输');
  return fetch(localUrl,{signal});
}

function updateTransfer(jobId){
  const t=downloadTransfers.get(jobId);
  if(!t) return;
  const panel=document.querySelector(`[data-transfer="${jobId}"]`);
  if(!panel) return;
  panel.hidden=false;
  const pct=t.totalBytes ? Math.min(t.active || t.error ? 99 : 100, Math.floor(t.receivedBytes/t.totalBytes*100)) : 0;
  const label=t.error ? `已停止：${t.error}` : t.active ? `正在接收第 ${Math.min(t.completed+1,t.count)} 个` : '接收完成，已发起浏览器保存';
  panel.innerHTML=`<div>${esc(t.route || "准备传输")} · ${esc(label)} · 已接收完整视频 <strong>${t.completed} / ${t.count}</strong></div>
    <div>${fmtSize(t.receivedBytes)} / ${fmtSize(t.totalBytes)} · <strong>${pct}%</strong></div>
    <progress style="width:100%;height:12px;accent-color:var(--accent)" max="100" value="${pct}" aria-label="视频传输进度"></progress>
    ${t.active ? `<button class="ghost small" onclick="cancelTransfer('${jobId}')">停止接收</button>` : '<div class="note">最终保存结果请查看浏览器下载列表；浏览器可能要求允许下载多个文件。</div>'}`;
  const button=document.querySelector(`[data-download-job="${jobId}"]`);
  if(button && t.active) button.textContent=`已接收 ${t.completed}/${t.count} · ${pct}%`;
}

function cancelTransfer(jobId){downloadTransfers.get(jobId)?.controller.abort();}

async function downloadSelected(jobId, singleName=null){
  if(jobBusy(jobId)) return;
  const job=cache.find(j=>j.id===jobId);
  if(!job) return;
  const files=(singleName===null ? selectedIn(job) : job.files.filter(f=>f.name===singleName)).map(f=>({...f}));
  if(!files.length) return;
  const t={active:true,completed:0,count:files.length,receivedBytes:0,totalBytes:files.reduce((n,f)=>n+(f.size||0),0),controller:new AbortController(),error:''};
  downloadTransfers.set(jobId,t);
  repaint();
  hintEl.textContent='已开始本组下载；可以继续勾选其他任务并下载，各组进度独立显示。';
  let lastPaint=0;
  try{
    for(const f of files){
      const r=await fetchVideo(jobId,f.name,t.controller.signal,route=>{t.route=route;updateTransfer(jobId);});
      if(!r.ok) throw new Error(`读取 ${f.name} 失败（HTTP ${r.status}）`);
      const size=Number(r.headers.get('content-length')) || f.size || 0;
      t.totalBytes+=size-(f.size||0);
      const chunks=[];let current=0;
      if(r.body){
        const reader=r.body.getReader();
        try{
          while(true){
            const {done,value}=await reader.read();
            if(done) break;
            chunks.push(value);current+=value.byteLength;t.receivedBytes+=value.byteLength;
            if(performance.now()-lastPaint>120){updateTransfer(jobId);lastPaint=performance.now();}
          }
        }finally{reader.releaseLock();}
      }else{
        const data=await r.arrayBuffer();chunks.push(data);current=data.byteLength;t.receivedBytes+=current;
      }
      if(t.controller.signal.aborted) throw new DOMException('Stopped','AbortError');
      if(size && current!==size) throw new Error(`${f.name} 传输不完整，请重试`);
      const blob=new Blob(chunks,{type:r.headers.get('content-type')||'video/mp4'});
      const url=URL.createObjectURL(blob);
      try{
        const a=document.createElement('a');a.href=url;a.download=f.name;
        document.body.appendChild(a);a.click();a.remove();
      }finally{setTimeout(()=>URL.revokeObjectURL(url),30000);}
      t.completed++;updateTransfer(jobId);
      // Space out browser save prompts; progress above is measured from response bytes.
      await new Promise(resolve=>setTimeout(resolve,700));
      if(t.controller.signal.aborted && t.completed<t.count) throw new DOMException('Stopped','AbortError');
    }
    hintEl.textContent=`已完整接收 ${t.completed}/${t.count} 个视频并发起保存，请查看浏览器下载列表。`;
  }catch(e){
    t.error=e.name==='AbortError' ? '已取消，之前发起保存的视频不受影响' : e.message;
    hintEl.textContent=`已接收 ${t.completed}/${t.count} 个。${t.error}`;
  }finally{
    t.active=false;repaint();
  }
}

// purge=false：只从列表拿掉，文件留在电脑上（默认，安全）
// purge=true ：连文件一起删，不可恢复
async function removeSelected(jobId, purge){
  if(jobBusy(jobId)) return;
  const job = cache.find(j => j.id === jobId);
  if(!job) return;
  const names = selectedIn(job).map(f => f.name);
  if(!names.length) return;

  const ok = purge
    ? await ask({
        title: `删除 ${names.length} 个视频？`,
        body: '电脑上的文件会一并删除，无法恢复。',
        ok: '删除', danger: true })
    : await ask({
        title: `从列表移出 ${names.length} 个？`,
        ok: '移出' });
  if(!ok) return;

  if(jobBusy(jobId)) return;
  busy=true; listEpoch++; repaint();
  hintEl.style.color='';
  hintEl.textContent=`正在${purge ? '删除文件' : '移出列表'}：${names.length} 个，请稍候…`;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);
  try{
    const r=await fetch(`/api/jobs/${jobId}/remove-files`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({names,purge}),signal:controller.signal
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.detail || `操作失败（HTTP ${r.status}）`);
    for(const name of data.removed || []) selected.delete(key(jobId,name));
    cache=cache.flatMap(j=>j.id!==jobId ? [j] : data.job ? [data.job] : []);
    const failed=data.failed || [];
    hintEl.textContent=`已${purge ? '删除' : '移出'} ${(data.removed||[]).length} 个视频。`+
      (failed.length ? `${failed.length} 个文件被占用或无法删除，请重试。` : purge ? '' : '原视频文件仍保留在电脑上。');
    hintEl.style.color=failed.length ? 'var(--err)' : '';
  }catch(e){
    hintEl.textContent=e.name==='AbortError' ? '连接超时，结果尚未确认；正在刷新列表，请核实后再试。' : e.message;
    hintEl.style.color='var(--err)';
  }finally{
    clearTimeout(timeout); listEpoch++; busy=false; repaint();
    void refresh(true);
  }
}

async function cancelJob(id){
  const job = cache.find(j => j.id === id);
  const n = job ? (job.files || []).length : 0;
  if(!await ask({
    title: '取消这个下载？',
    body: n ? `已经下好的 ${n} 个会保留，没下的不再继续。` : '还没下到文件，取消后这条记录会消失。',
    ok: '取消下载', danger: true })) return;
  await fetch(`/api/jobs/${id}/cancel`, {method:'POST'});
  await refresh(true);
}

async function cancelAll(){
  const act = cache.filter(j => j.status === 'running' || j.status === 'queued');
  if(!act.length) return;
  if(!await ask({
    title: `取消全部 ${act.length} 个下载？`,
    body: '已经下好的视频都会保留，没下完的不再继续。',
    ok: '全部取消', danger: true })) return;
  await fetch('/api/jobs/cancel-all?scope=' + SCOPE, {method:'POST'});
  await refresh(true);
}

async function removeJob(id, purge){
  if(jobBusy(id)) return;
  const job = cache.find(j => j.id === id);
  const n = job ? (job.files || []).length : 0;
  const ok = purge
    ? await ask({
        title: `删除这个任务的 ${n} 个视频？`,
        body: '电脑上的文件会一并删除，无法恢复。',
        ok: '删除', danger: true })
    : await ask({
        title: '把这个任务从列表移出？',
        ok: '移出' });
  if(!ok) return;
  if(jobBusy(id)) return;
  busy=true;listEpoch++;repaint();
  hintEl.textContent='正在移除任务…';
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);
  try{
    const r=await fetch(`/api/jobs/${id}?purge=${purge}`,{method:'DELETE',signal:controller.signal});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail || `操作失败（HTTP ${r.status}）`);}
    cache=cache.filter(j=>j.id!==id);
    [...selected].forEach(k=>{if(k.startsWith(id+'\u0000')) selected.delete(k);});
    hintEl.textContent='任务已移除。';
  }catch(e){hintEl.textContent=e.name==='AbortError' ? '请求超时，请核实刷新后的列表。' : e.message;}
  finally{clearTimeout(timeout);listEpoch++;busy=false;repaint();void refresh(true);}

}

const countEl = $('#linkCount');

function updateCount(){
  const n = urlEl.value.split(/\s+/).filter(Boolean).length;
  countEl.textContent = n > 1 ? `检测到 ${n} 个链接` : '';
}

async function submit(){
  const url = urlEl.value.trim();
  if(!url) return;
  goEl.disabled = true;
  try{
    const r = await fetch('/api/jobs', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url,mode:document.querySelector("#sourceMode").value})
    });
    const data = await r.json().catch(() => ({}));
    if(!r.ok){
      hintEl.textContent = data.detail || '请求失败';
      hintEl.style.color = 'var(--err)';
    }else{
      urlEl.value = '';
      updateCount();
      const n = (data.created || []).length;
      const bad = (data.rejected || []).length;
      hintEl.textContent = bad
        ? `已加入 ${n} 个任务，${bad} 个无法识别已跳过。`
        : `已加入 ${n} 个任务。`;
      hintEl.style.color = bad ? 'var(--warn)' : '';
      refresh(true);
    }
  } finally { goEl.disabled = false; }
}

goEl.onclick = submit;
urlEl.addEventListener('input', updateCount);
// 多行输入里回车要能换行，所以用 Ctrl/Cmd + Enter 提交
urlEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
});

// ================= 登录 / 账号 =================
const gateEl = $('#gate'), mainEl = $('#main'), gUser = $('#gUser'), gPass = $('#gPass'),
      gGo = $('#gGo'), gMsg = $('#gMsg'), gateTitle = $('#gateTitle'), gateSub = $('#gateSub');
let ME = null, SETUP = false, timer = null, ADMIN_API = true, LOCAL = false, SCOPE = 'browser';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

async function boot(){
  const r = await fetch('/api/me');
  const d = await r.json();
  SETUP = !d.has_admin;
  ME = d.is_admin ? {name:d.admin_name,is_admin:true} : null;
  LOCAL = d.local;
  if(!ME) SCOPE = 'browser';
  gateEl.hidden = true; mainEl.hidden = false;
  $('#whoName').textContent = ME ? ME.name + '（管理员）' : '本浏览器记录 · ' + d.device;
  $('#adminBtn').hidden = !ME;
  $('#cloudAccountsBtn').hidden = !ME;
  $('#scopeBtn').hidden = !ME;
  $('#logoutBtn').hidden = !ME;
  $('#loginBtn').hidden = !!ME;
  $('#adminPanel').hidden = true;
  $('#scopeBtn').textContent = SCOPE === 'all' ? '返回本浏览器记录' : '查看全部记录';
  hintEl.textContent = SCOPE === 'all' ? '管理视图：显示全部浏览器的任务。' : '免登录使用：仅显示本浏览器提交的任务。清除 Cookie 或使用无痕窗口会产生新的列表。';
  lastSnapshot = '';
  await refresh(true);
  if(!timer) timer = setInterval(refresh,1200);
}

function showGate(){
  mainEl.hidden=true; gateEl.hidden=false;
  gateTitle.textContent=SETUP ? '设置管理员' : '管理员登录';
  gateSub.textContent='管理员可以查看所有浏览器的下载记录。';
  gGo.textContent=SETUP ? '创建并登录' : '登录';
  gUser.focus();
}
async function switchScope(){
  if(busy || transfersActive()){hintEl.textContent='请先等待各组下载完成，或分别停止接收。';return;}
  SCOPE = SCOPE === 'all' ? 'browser' : 'all';
  selected.clear(); await boot();
}
function folderLocatorHelp(){
  hintEl.innerHTML='定位当前电脑的视频需安装一次浏览器扩展。<a href="/folder-locator-help.html" target="_blank" rel="noopener">安装定位扩展（查看步骤）</a>。已安装请刷新网页；临时也可按 Ctrl＋J 定位。';
}
async function revealFile(id,name){
  try{
    const r=await fetch(`/api/reveal/${id}/${encodeURIComponent(name)}`,{method:'POST'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail || '打开文件夹失败');
    hintEl.textContent='已在这台电脑的文件夹中选中视频。';
  }catch(e){hintEl.textContent=e.message;}
}
let previewAbort=null;
function closePreview(){
  if(previewAbort) previewAbort.abort();
  $('#previewVideo').pause(); $('#previewVideo').removeAttribute('src'); $('#previewVideo').load();
  $('#shareVideo').onclick=null; $('#previewDialog').close();
}
$('#previewDialog').addEventListener('cancel',e=>{e.preventDefault();closePreview();});
async function previewFile(id,name){
  if(previewAbort) previewAbort.abort();
  const controller = new AbortController(); previewAbort=controller;
  const url=`/api/files/${id}/${encodeURIComponent(name)}`;
  $('#previewVideo').src=url+'?inline=true';
  $('#saveOriginal').href=url; $('#saveOriginal').download=name;
  $('#saveOriginal').onclick=e=>{e.preventDefault();downloadSelected(id,name);};
  const share=$('#shareVideo'), help=$('#saveHelp');
  share.hidden=true; share.onclick=null;
  help.textContent=MOBILE ? '下载后可从手机文件/下载列表中打开，通过系统菜单保存到相册。iPhone 可选择分享 → 存储视频。' : '预览和下载均使用原视频文件。';
  $('#previewDialog').showModal();
  if(!MOBILE || !navigator.canShare || !navigator.share || !window.isSecureContext) return;
  help.textContent='正在准备系统分享文件…';
  try{
    const r=await fetchVideo(id,name,controller.signal,route=>{help.textContent=route+"，正在准备系统分享…";});
    if(!r.ok) throw new Error('读取视频失败');
    const blob=await r.blob();
    if(controller.signal.aborted) return;
    const file=new File([blob],name,{type:blob.type});
    if(!navigator.canShare({files:[file]})){help.textContent='此浏览器不支持分享该视频，请下载后从文件应用保存。';return;}
    share.hidden=false; help.textContent='点击分享，在系统菜单中选择存储视频或相册（以手机支持的选项为准）。';
    share.onclick=async()=>{
      try{await navigator.share({files:[file]});}
      catch(e){if(e.name!=='AbortError') help.textContent='系统分享不可用，请使用下载原视频。';}
    };
  }catch(e){if(e.name!=='AbortError') help.textContent='请使用下载原视频，再从文件应用保存到相册。';}
}

async function doGate(){
  const username = gUser.value.trim(), password = gPass.value;
  if(!username || !password){ gMsg.textContent = '请填完整'; gMsg.style.color = 'var(--err)'; return; }
  gGo.disabled = true;
  try{
    const r = await fetch(ADMIN_API ? '/api/admin/login' : (SETUP ? '/api/setup' : '/api/login'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      gMsg.textContent = e.detail || '失败'; gMsg.style.color = 'var(--err)';
    }else{
      gPass.value = ''; gMsg.textContent = '';
      SCOPE = 'all';
      await boot();
    }
  } catch(e) {
    gMsg.textContent = '登录请求失败，请检查服务连接后重试';
    gMsg.style.color = 'var(--err)';
  } finally { gGo.disabled = false; }
}

gGo.onclick = doGate;
[gUser, gPass].forEach(el => el.addEventListener('keydown', e => {
  if(e.key === 'Enter') doGate();
}));

async function logout(){
  if(busy || transfersActive()){hintEl.textContent='请先等待各组下载完成，或分别停止接收。';return;}
  if(!await ask({title:'退出登录？', ok:'退出'})) return;
  await fetch('/api/logout', {method:'POST'});
  ME = null;
  selected.clear();
  jobsEl.innerHTML = '';
  cache = [];
  await boot();
}

// ================= 账号管理（仅管理员） =================
function toggleAdmin(){
  const p = $('#adminPanel');
  p.hidden = !p.hidden;
  if(!p.hidden) loadUsers();
}

async function loadUsers(){
  const r = await fetch('/api/users');
  if(!r.ok) return;
  const users = await r.json();
  $('#userList').innerHTML = users.map(u => `
    <div class="user-row">
      <span><strong>${esc(u.name)}</strong>${u.is_admin ? ' <span class="badge">管理员</span>' : ''}</span>
      <span class="fsize">${u.jobs} 条记录</span>
      <span class="spacer"></span>
      <button class="ghost" onclick="resetPwd('${esc(u.name)}')">改密码</button>
      ${u.name === ME.name ? '' :
        `<button class="ghost danger" onclick="delUser('${esc(u.name)}')">删除</button>`}
    </div>`).join('');
}

async function addUser(){
  const username = $('#nUser').value.trim(), password = $('#nPass').value;
  const msg = $('#adminMsg');
  if(!username || !password){ msg.textContent = '用户名和密码都要填'; msg.style.color='var(--err)'; return; }
  const r = await fetch('/api/users', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password, is_admin:false})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ msg.textContent = d.detail || '添加失败'; msg.style.color='var(--err)'; return; }
  $('#nUser').value=''; $('#nPass').value='';
  msg.textContent = `已添加「${username}」，把用户名和密码告诉他就能用了。`;
  msg.style.color = 'var(--ok)';
  loadUsers();
}

async function resetPwd(name){
  const pwd = prompt(`给「${name}」设置新密码（至少 4 位）：`);
  if(!pwd) return;
  const r = await fetch(`/api/users/${encodeURIComponent(name)}/password`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pwd})
  });
  const d = await r.json().catch(()=>({}));
  const msg = $('#adminMsg');
  msg.textContent = r.ok ? `「${name}」的密码已重置，他需要重新登录。` : (d.detail || '失败');
  msg.style.color = r.ok ? 'var(--ok)' : 'var(--err)';
}

async function delUser(name){
  if(!await ask({
    title: `删除账号「${name}」？`,
    body: '他将无法再登录。已经下载的视频文件不受影响。',
    ok: '删除', danger: true })) return;
  const r = await fetch(`/api/users/${encodeURIComponent(name)}`, {method:'DELETE'});
  const d = await r.json().catch(()=>({}));
  const msg = $('#adminMsg');
  msg.textContent = r.ok ? `已删除「${name}」。` : (d.detail || '失败');
  msg.style.color = r.ok ? 'var(--ok)' : 'var(--err)';
  loadUsers();
}

boot();
